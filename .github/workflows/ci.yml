name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx ruff

      - name: Install package
        run: pip install -e .

      - name: Lint (ruff)
        run: ruff check pricing_heterogeneity tests

      - name: Run tests
        run: pytest --cov=pricing_heterogeneity --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pricing-heterogeneity:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8080:8080 pricing-heterogeneity:ci
          sleep 8
          curl -fsS http://localhost:8080/health || (docker logs api && exit 1)
          docker stop api
