version: "3.9"
services:
  api:
    build: .
    image: pricing-heterogeneity:latest
    container_name: pricing-api
    ports: ["8080:8080"]
    volumes:
      - ./outputs:/app/outputs
    environment:
      - REGISTRY_DIR=/app/outputs/registry
      - PYTHONUNBUFFERED=1

  dashboard:
    image: pricing-heterogeneity:latest
    container_name: pricing-dashboard
    depends_on: [api]
    command: >
      sh -c "pip install streamlit &&
             streamlit run pricing_heterogeneity/dashboard/app.py
             --server.port 8501 --server.address 0.0.0.0"
    ports: ["8501:8501"]
    volumes:
      - ./outputs:/app/outputs
