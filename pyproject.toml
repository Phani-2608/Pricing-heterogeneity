[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing-heterogeneity"
version = "1.0.0"
description = "Production-ready heterogeneous treatment effects platform for customer pricing."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Phanindra Reddy Mathireddy"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
]

[project.optional-dependencies]
boosting = ["xgboost>=1.7", "lightgbm>=4.0"]
explain = ["shap>=0.44"]
dashboard = ["streamlit>=1.28"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.24",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
pricing-train = "pricing_heterogeneity.pipeline:run_pipeline"

[tool.setuptools.packages.find]
where = ["."]
include = ["pricing_heterogeneity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = ["slow: marks tests that take a long time"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
